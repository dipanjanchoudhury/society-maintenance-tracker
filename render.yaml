services:
  # Backend API Web Service (Free Tier, No Card Required)
  - type: web
    name: society-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Prompts the user to enter their free Neon/Supabase DB connection string
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: "/tmp/uploads"
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: USE_MOCK_EMAIL
        value: "true"
