services:
  # Backend API Web Service
  - type: web
    name: society-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: society-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: society-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: USE_MOCK_EMAIL
        value: "true"
    disk:
      name: uploads-disk
      mountPath: /var/data/uploads
      sizeGB: 1

  # Celery Background Worker
  - type: worker
    name: society-worker
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: society-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: society-redis
          property: connectionString
      - key: USE_MOCK_EMAIL
        value: "true"

databases:
  - name: society-db
    databaseName: society_tracker
    user: postgres

redis:
  - name: society-redis
    ipAllowList: []
